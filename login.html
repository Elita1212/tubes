<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Teman Ajar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth">
        <div class="sisi">
            <form class="kartu kartu-login" id="formLogin" action="proses_login.php" method="POST">
                <a href="index.html" class="kembali-kartu">&larr; Kembali ke Beranda</a>
                <div class="header-login">
                    <svg class="ikon-masuk" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                    <h1>WELCOME</h1>
                </div>

                <div class="baris-input-ikon">
                    <span class="ikon-input">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </span>
                    <input type="text" id="username" name="username" placeholder="USERNAME" required autocomplete="username">
                </div>

                <div class="baris-input-ikon">
                    <span class="ikon-input">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="PASSWORD" required autocomplete="current-password">
                </div>

                <div class="tautan-lupa">
                    Lupa Password? <a href="login.html">KLIK DISINI</a>
                </div>

                <button type="submit" class="tombol-hitam-kapsul">LOGIN</button>

                <div class="pesan" id="pesanLogin"></div>
                <div class="tautan-bawah-baru">
                    Belum punya akun? <a href="daftar.html">KLIK DISINI</a>
                </div>
            </form>
        </div>

        <div class="sisi-logo">
            <a href="index.html" aria-label="Teman Ajar">
                <img src="logotemanajar.jpeg" alt="Teman Ajar" class="logo-auth">
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
