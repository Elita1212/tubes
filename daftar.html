<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Teman Ajar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth">
        <div class="sisi-logo">
            <a href="index.html" aria-label="Teman Ajar">
                <img src="logotemanajar.jpeg"Teman Ajar" class="logo-auth">
            </a>
        </div>

        <div class="sisi">
            <form class="kartu" id="formDaftar" action="proses_daftar.php" method="POST">
                <a href="index.html" class="kembali-kartu">&larr; Kembali ke Beranda</a>
                <h1>DAFTAR</h1>
                <div class="baris">
                    <label for="username">USERNAME <span>:</span></label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="baris">
                    <label for="password">PASSWORD <span>:</span></label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                </div>
                <div class="baris">
                    <label for="email">EMAIL <span>:</span></label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="baris">
                    <label for="prodi">PRODI <span>:</span></label>
                    <input type="text" id="prodi" name="prodi" required>
                </div>
                <div class="baris">
                    <label for="nim">NIM <span>:</span></label>
                    <input type="text" id="nim" name="nim" required inputmode="numeric">
                </div>
                <button type="submit" class="tombol-hitam">DAFTAR</button>

                <div class="pesan" id="pesanDaftar"></div>
                <div class="tautan-bawah">Sudah punya akun? <a href="login.html">Login</a></div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
